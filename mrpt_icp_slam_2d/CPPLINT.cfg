# MRPT uses a tab-based style that predates this repo; suppress pre-existing
# style violations so cpplint only catches new regressions in ROS 2 wrappers.
filter=-whitespace,-build/namespaces,-build/include,-build/header_guard,-build/c++11,-readability/namespace,-readability/todo,-readability/casting,-readability/braces,-legal/copyright,-runtime/int,-runtime/explicit,-runtime/references
linelength=100
