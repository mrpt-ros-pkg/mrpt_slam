# Based on GTSAM file (by @ProfFan)
name: CI Build colcon

on: [push, pull_request]

jobs:
  build_docker: # On Linux, iterates on all ROS 2 distributions.
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        include:
          # Humble Hawksbill (May 2022 - May 2027)
          - docker_image: ubuntu:jammy
            ros_distribution: humble
            ros_version: 2

          # Jazzy Jalisco (May 2024 - May 2029)
          - docker_image: ubuntu:noble
            ros_distribution: jazzy
            ros_version: 2

          # Rolling Ridley (No End-Of-Life)
          - docker_image: ubuntu:noble
            ros_distribution: rolling
            ros_version: 2

    container:
      image: ${{ matrix.docker_image }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Setup ROS environment
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}

      - name: Install rosdep dependencies
        run: |
          . /opt/ros/*/setup.sh
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y

      - name: Install MRPT ROS packages (rosdep gap workaround)
        run: |
          apt-get install -y \
            ros-${{ matrix.ros_distribution }}-mrpt-msgs \
            ros-${{ matrix.ros_distribution }}-mrpt-msgs-bridge \
            ros-${{ matrix.ros_distribution }}-mrpt-libgui \
            ros-${{ matrix.ros_distribution }}-mrpt-libslam \
            ros-${{ matrix.ros_distribution }}-mrpt-libros-bridge \
            ros-${{ matrix.ros_distribution }}-mrpt-libapps || true

      - name: Build with colcon
        run: |
          . /opt/ros/*/setup.sh
          MAKEFLAGS="-j2" colcon build \
            --symlink-install \
            --parallel-workers 2 \
            --event-handlers console_direct+

      - name: Run tests
        run: |
          . /opt/ros/*/setup.sh
          . install/setup.sh
          colcon test \
            --packages-select \
              mrpt_ekf_slam_2d mrpt_ekf_slam_3d \
              mrpt_icp_slam_2d mrpt_rbpf_slam mrpt_graphslam_2d \
            --event-handlers console_direct+
          colcon test-result --verbose

      - name: Archive install tree
        run: |
          tar -czf mrpt-slam-${{ matrix.ros_distribution }}.tar.gz install

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrpt-slam-${{ matrix.ros_distribution }}
          path: mrpt-slam-${{ matrix.ros_distribution }}.tar.gz
